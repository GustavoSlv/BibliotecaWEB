<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BibliotecaWeb</title>
    <link rel="stylesheet" href="../Css/style.css">
<link rel="stylesheet" href="../Css/Login.css">
</head>

<body>

    <main>
        <section class="login-container">

            <h1>BibliotecaWeb</h1>
            <h2>Entrar na sua conta</h2>

            <form id="form-login">

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email"
                    required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                    autocomplete="current-password" required>

                <button type="submit">Entrar</button>

            </form>

            <p id="mensagem-login" role="status"></p>

            <p>
                Não possui uma conta?
                <a href="../Html/UsuarioCadastro.html">Cadastre-se</a>
            </p>


        </section>
    </main>

    <script src="../JavaScript/UsuarioLogin.js"></script>
</body>

</html>
